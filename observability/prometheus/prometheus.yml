global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'orders'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['orders:8081']

  - job_name: 'inventory'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory:8082']

  - job_name: 'frontend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['frontend:8080']

  - job_name: 'checkout'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['checkout:8083']

  - job_name: 'reporting'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['reporting:8084']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
