services:
  postgres:
    image: postgres:16
    container_name: afi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders:
    build: ./services/orders
    container_name: afi-orders
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # Phase 2: set to the -javaagent flags (see appd/healthrules.md); empty = agent-free.
      JAVA_TOOL_OPTIONS: ${ORDERS_JAVA_TOOL_OPTIONS:-}
    volumes:
      - ./agents:/opt/appdynamics:ro

  inventory:
    build: ./services/inventory
    container_name: afi-inventory
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: ${INVENTORY_JAVA_TOOL_OPTIONS:-}
    volumes:
      - ./agents:/opt/appdynamics:ro

  frontend:
    build: ./services/frontend
    container_name: afi-frontend
    depends_on:
      - orders
      - inventory
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: ${FRONTEND_JAVA_TOOL_OPTIONS:-}
    volumes:
      - ./agents:/opt/appdynamics:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: afi-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_MONITOR_USER:-appd_monitor}:${POSTGRES_MONITOR_PASSWORD:-appd_monitor_pass}@postgres:5432/${POSTGRES_DB:-appdb}?sslmode=disable"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: afi-prometheus
    depends_on:
      - orders
      - inventory
      - frontend
      - postgres-exporter
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: afi-grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
  promdata:
  grafanadata:
