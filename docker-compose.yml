services:
  postgres:
    image: postgres:16
    container_name: afi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders:
    build: ./services/orders
    container_name: afi-orders
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    entrypoint: ["/bin/sh", "/docker-entrypoint-appd.sh"]
    environment:
      # Phase 2: set AGENT_ENABLED=true once controller keys are available;
      # empty/false = agent-free, unchanged Phase 1 behaviour.
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      CONTROLLER_HOST: ${CONTROLLER_HOST:-}
      CONTROLLER_PORT: ${CONTROLLER_PORT:-8090}
      SSL_ENABLED: ${SSL_ENABLED:-false}
      ACCOUNT_NAME: ${ACCOUNT_NAME:-}
      ACCOUNT_ACCESS_KEY: ${ACCOUNT_ACCESS_KEY:-}
      APPD_APPLICATION_NAME: ${APPD_APPLICATION_NAME:-AFI-UC3-Demo}
      APPD_TIER_NAME: orders
      APPD_NODE_NAME: orders-01
    volumes:
      - ./agents/java-agent:/opt/appdynamics
      - ./appd/entrypoint.sh:/docker-entrypoint-appd.sh:ro

  inventory:
    build: ./services/inventory
    container_name: afi-inventory
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    entrypoint: ["/bin/sh", "/docker-entrypoint-appd.sh"]
    environment:
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      CONTROLLER_HOST: ${CONTROLLER_HOST:-}
      CONTROLLER_PORT: ${CONTROLLER_PORT:-8090}
      SSL_ENABLED: ${SSL_ENABLED:-false}
      ACCOUNT_NAME: ${ACCOUNT_NAME:-}
      ACCOUNT_ACCESS_KEY: ${ACCOUNT_ACCESS_KEY:-}
      APPD_APPLICATION_NAME: ${APPD_APPLICATION_NAME:-AFI-UC3-Demo}
      APPD_TIER_NAME: inventory
      APPD_NODE_NAME: inventory-01
    volumes:
      - ./agents/java-agent:/opt/appdynamics
      - ./appd/entrypoint.sh:/docker-entrypoint-appd.sh:ro

  frontend:
    build: ./services/frontend
    container_name: afi-frontend
    depends_on:
      - orders
      - inventory
    ports:
      - "8080:8080"
    entrypoint: ["/bin/sh", "/docker-entrypoint-appd.sh"]
    environment:
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      CONTROLLER_HOST: ${CONTROLLER_HOST:-}
      CONTROLLER_PORT: ${CONTROLLER_PORT:-8090}
      SSL_ENABLED: ${SSL_ENABLED:-false}
      ACCOUNT_NAME: ${ACCOUNT_NAME:-}
      ACCOUNT_ACCESS_KEY: ${ACCOUNT_ACCESS_KEY:-}
      APPD_APPLICATION_NAME: ${APPD_APPLICATION_NAME:-AFI-UC3-Demo}
      APPD_TIER_NAME: frontend
      APPD_NODE_NAME: frontend-01
    volumes:
      - ./agents/java-agent:/opt/appdynamics
      - ./appd/entrypoint.sh:/docker-entrypoint-appd.sh:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: afi-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_MONITOR_USER:-appd_monitor}:${POSTGRES_MONITOR_PASSWORD:-appd_monitor_pass}@postgres:5432/${POSTGRES_DB:-appdb}?sslmode=disable"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: afi-prometheus
    depends_on:
      - orders
      - inventory
      - frontend
      - postgres-exporter
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: afi-grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"

  # ---- Phase 2: AppDynamics agents, opt-in (start with `docker compose
  # --profile appd up -d` once controller keys are set in .env) ----

  db-agent:
    build: ./agents/db-agent
    container_name: afi-db-agent
    profiles: ["appd"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME: ${CONTROLLER_HOST:-}
      APPDYNAMICS_CONTROLLER_PORT: ${CONTROLLER_PORT:-8090}
      APPDYNAMICS_CONTROLLER_SSL_ENABLED: ${SSL_ENABLED:-false}
      APPDYNAMICS_AGENT_ACCOUNT_NAME: ${ACCOUNT_NAME:-}
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: ${ACCOUNT_ACCESS_KEY:-}
      APPDYNAMICS_DB_AGENT_NAME: afi-uc3-db-agent
      APPDYNAMICS_DB_PROPERTIES: "-Ddbagent.telemetry.enabled=true"

  machine-agent:
    build: ./appd/machine-agent
    container_name: afi-machine-agent
    profiles: ["appd"]
    depends_on:
      - orders
    volumes:
      - ./agents/machine-agent:/opt/appdynamics/machine-agent
    command: ["./bin/machine-agent"]
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME: ${CONTROLLER_HOST:-}
      APPDYNAMICS_CONTROLLER_PORT: ${CONTROLLER_PORT:-8090}
      APPDYNAMICS_CONTROLLER_SSL_ENABLED: ${SSL_ENABLED:-false}
      APPDYNAMICS_AGENT_ACCOUNT_NAME: ${ACCOUNT_NAME:-}
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: ${ACCOUNT_ACCESS_KEY:-}
      # Enables Server Visibility (hardware metrics + Host node on the flow
      # map) - this is what supplies the topology's 5th component.
      APPDYNAMICS_SIM_ENABLED: "true"

volumes:
  pgdata:
  promdata:
  grafanadata:
